version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: korp-teste-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-korp_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-korp_password}
      POSTGRES_DB: ${DB_NAME:-korp_teste_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-korp_user} -d ${DB_NAME:-korp_teste_db}"]
      interval: 5s
      timeout: 5s
      retries: 20

  inventory-api:
    build:
      context: ./backend/Korp.Inventory.API
      dockerfile: Dockerfile
    container_name: korp-inventory-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=korp_teste_db;Username=korp_user;Password=korp_password
    ports:
      - "7058:8080"

  invoicing-api:
    build:
      context: ./backend/Korp.Invoicing.API
      dockerfile: Dockerfile
    container_name: korp-invoicing-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=korp_teste_db;Username=korp_user;Password=korp_password
      InventoryApi__BaseUrl: http://inventory-api:8080
    ports:
      - "7077:8080"

volumes:
  postgres_data: